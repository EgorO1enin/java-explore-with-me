server:
  port: 9090

spring:
  application:
    name: stats-server
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm_stats
    username: e.olenin
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

stats:
  client:
    url: "http://localhost:9090"
    connect-timeout: 5000
    read-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
---
# Профиль для Docker
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://stats-db:5432/ewm_stats
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

stats:
  client:
    url: "http://localhost:9090"
    connect-timeout: 5000
    read-timeout: 10000

logging:
  level:
    ru.practicum.ewm.stats: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
